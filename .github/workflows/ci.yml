name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Development target: fmt, clippy, tests, and fixture screenshots for review.
  macos:
    name: macOS (desktop) — fmt / clippy / test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version comes from rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt,clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Render fixture screenshots (software renderer)
        run: |
          for sc in default empty rain offline stale; do
            cargo run --locked --quiet -- --fixture "$sc" --now 2026-10-11T10:40 --screenshot-dir shots
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots
          path: shots/*.png

  # Production target: native builds (no cross toolchain needed for the
  # system libraries), in Debian bookworm so the binary runs on bookworm/trixie
  # and Raspberry Pi OS Lite 64-bit (glibc 2.36 baseline).
  linux:
    name: Linux ${{ matrix.arch }} — kms build + .deb
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm
    steps:
      - name: System packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config cmake clang dpkg-dev file \
            libinput-dev libudev-dev libxkbcommon-dev libgbm-dev libdrm-dev \
            libegl-dev libgles-dev libfontconfig-dev libfreetype-dev \
            fonts-noto-cjk
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup only; the version comes from rust-toolchain.toml.
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt,clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Clippy (kms)
        run: cargo clippy --locked --no-default-features --features kms --all-targets -- -D warnings
      - name: Tests (kms features; UI tests use the headless testing backend)
        run: cargo test --locked --no-default-features --features kms
      - name: Release build
        run: cargo build --locked --release --no-default-features --features kms
      - name: Inspect binary
        run: |
          file target/release/home-display
          ldd target/release/home-display || true
          ./target/release/home-display --version
          ./target/release/home-display --check-config --config packaging/config/config.toml
      - name: Build .deb
        run: |
          cargo install cargo-deb --locked --version "^3"
          cargo deb --locked --no-build --no-strip
          dpkg-deb --info target/debian/*.deb
          dpkg-deb --contents target/debian/*.deb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: home-display-linux-${{ matrix.arch }}
          path: |
            target/debian/*.deb
            target/release/home-display

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: home-display-linux-*
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" --generate-notes dist/*/debian/*.deb \
            packaging/raspberry-pi/install.sh
