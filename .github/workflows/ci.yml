name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # mise: never prompt in CI.
  MISE_YES: "1"

jobs:
  # Native builds (no cross toolchain needed for the system libraries), in
  # Debian bookworm so the binary runs on bookworm/trixie and Raspberry Pi OS
  # Lite 64-bit (glibc 2.36 baseline). arm64 is the main target (Raspberry Pi),
  # so OS-independent checks (rustfmt) run there only. macOS is not built in CI:
  # it is run from source (`mise run dev`) and checked locally (`mise run check`).
  linux:
    name: Linux ${{ matrix.arch }} — kms build + .deb
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # debian:bookworm (multi-arch index digest, amd64 + arm64), pinned 2026-10-11.
    container: debian:bookworm@sha256:2c037a04925515fdd6ea85ea14a682d0e79931f5e9f5d07b6dbfc6ba12f9e858
    steps:
      - name: System packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config cmake clang dpkg-dev file \
            libinput-dev libudev-dev libxkbcommon-dev libgbm-dev libdrm-dev \
            libegl-dev libgles-dev libfontconfig-dev libfreetype-dev \
            fonts-noto-cjk
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The .deb file name, dpkg version and `--version` all come from Cargo.toml,
      # so a release tag must be exactly v<Cargo.toml version>. Fail before building.
      - name: Tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver=$(sed -n '/^\[package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          if [ "${GITHUB_REF_NAME}" != "v${ver}" ]; then
            echo "tag ${GITHUB_REF_NAME} != v${ver} (Cargo.toml). Update Cargo.toml version (and Cargo.lock) first."
            exit 1
          fi
      # rustup-init at a fixed version, verified against SHA-256 values recorded here
      # (from static.rust-lang.org) before it runs. mise then installs the Rust
      # version from mise.toml through this rustup.
      - name: Install rustup
        env:
          RUSTUP_VERSION: "1.29.1"
        run: |
          case "$(uname -m)" in
            x86_64)  t=x86_64-unknown-linux-gnu;  sum=dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71 ;;
            aarch64) t=aarch64-unknown-linux-gnu; sum=15f6e4ce9f583b929c996c91562bad6d4454f3281de858b02cdfdef615fac433 ;;
            *) echo "unsupported arch $(uname -m)"; exit 1 ;;
          esac
          curl --proto '=https' --tlsv1.2 -sSfLo /tmp/rustup-init "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/${t}/rustup-init"
          echo "${sum}  /tmp/rustup-init" | sha256sum -c -
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain none
          rm /tmp/rustup-init
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # mise at a fixed version, verified against SHA-256 values recorded here
      # (from the release's SHASUMS256.txt). Builds run through the same mise
      # tasks as on a developer machine.
      - name: Install mise
        env:
          MISE_VERSION: "2026.9.4"
        run: |
          case "$(uname -m)" in
            x86_64)  a=linux-x64;   sum=175e85492247586b8bcc428caf9f6bbe79b18edaa28e9a084086fd1b40cc8a0d ;;
            aarch64) a=linux-arm64; sum=858911883188ab4f0c10ba0d4e401f3af47737d3035c1820cd3c8aa400d09478 ;;
            *) echo "unsupported arch $(uname -m)"; exit 1 ;;
          esac
          curl --proto '=https' --tlsv1.2 -sSfLo /usr/local/bin/mise "https://github.com/jdx/mise/releases/download/v${MISE_VERSION}/mise-v${MISE_VERSION}-${a}"
          echo "${sum}  /usr/local/bin/mise" | sha256sum -c -
          chmod +x /usr/local/bin/mise
          mise --version
          mise trust
      - name: Install Rust (mise.toml; must match rust-toolchain.toml)
        run: |
          want=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          grep -q "^rust = { version = \"${want}\"" mise.toml || { echo "rust-toolchain.toml (${want}) and mise.toml disagree"; exit 1; }
          mise install
          mise exec -- rustc --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ matrix.arch }}-${{ hashFiles('mise.toml', 'rust-toolchain.toml', 'Cargo.lock') }}
      - name: Format
        if: matrix.arch == 'arm64'
        run: mise run fmt -- --check
      - name: Clippy (kms)
        run: mise run lint-kms
      - name: Tests (kms features; UI tests use the headless testing backend)
        run: mise run test-kms
      - name: Release build (build-machine paths stripped)
        run: mise run build-kms
      - name: No build-machine paths in the binary
        run: mise run check-paths
      - name: Inspect binary
        run: |
          file target/release/home-display
          ldd target/release/home-display || true
          ./target/release/home-display --version
          ./target/release/home-display --check-config --config packaging/config/config.toml
      - name: Build .deb
        run: |
          mise run deb
          dpkg-deb --info target/debian/*.deb
          dpkg-deb --contents target/debian/*.deb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: home-display-linux-${{ matrix.arch }}
          path: |
            target/debian/*.deb
            target/release/home-display

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: home-display-linux-*
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" --generate-notes dist/*/debian/*.deb \
            packaging/raspberry-pi/install.sh
