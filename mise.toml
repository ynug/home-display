# mise — toolchain + common tasks for Home Display.
#   mise install          # Rust (rustfmt / clippy 付き) を用意
#   mise run              # タスク一覧から選んで実行
#   mise run dev          # サンプルデータで起動
#   mise run check        # fmt + clippy + test（手元の確認）

[tools]
# CI also installs Rust through this file. rust-toolchain.toml pins the same
# version for plain rustup/cargo users — change both together (CI checks they match).
rust = { version = "1.98.1", components = "rustfmt,clippy" }

[env]
# 開発時は .env（git 管理外）から秘密の iCal URL などを読み込む。無ければ無視。
_.file = { path = ".env", redact = true }
RUST_LOG = "{{ get_env(name='RUST_LOG', default='info') }}"

# ───────────── 起動 ─────────────

[tasks.dev]
description = "サンプルデータ（fixture）で起動。例: mise run dev -- --fixture rain"
run = "cargo run -- --fixture default"

[tasks.live]
description = "実データで起動（~/.config/home-display/config.toml か packaging の設定を使用）"
run = """
if [ -f "$HOME/.config/home-display/config.toml" ]; then
  cargo run
else
  cargo run -- --config packaging/config/config.toml
fi
"""

[tasks.demo]
description = "時刻を 10:40 に固定し、全画面で表示（デモ・確認用）"
run = "cargo run -- --fixture default --now 2026-10-11T10:40 --fullscreen"

[tasks.fixtures]
description = "fixture シナリオの一覧"
run = "cargo run --quiet -- --list-fixtures"

[tasks.screenshots]
description = "全シナリオを 1920x1080 PNG に描画（target/shots/）"
run = """
cargo build --release
for sc in default empty holiday rain long offline stale; do
  ./target/release/home-display --fixture "$sc" --now 2026-10-11T10:40 --screenshot-dir target/shots
done
"""

[tasks.check-config]
description = "設定ファイルの検証（iCal URL は表示しない）"
run = "cargo run --quiet -- --check-config"

# ───────────── 品質チェック ─────────────

[tasks.fmt]
description = "コード整形"
run = "cargo fmt --all"

[tasks.lint]
description = "clippy（警告をエラー扱い）"
run = "cargo clippy --all-targets -- -D warnings"

[tasks.test]
description = "テスト（単体・UI スモーク・描画 E2E）"
run = "cargo test"

[tasks.check]
description = "手元の確認: fmt --check → clippy → test（このマシン向けの構成）"
run = [
  "cargo fmt --all --check",
  "cargo clippy --all-targets --locked -- -D warnings",
  "cargo test --locked",
]

# Linux 実機向け（LinuxKMS）の確認。CI はこれらのタスクを実行する。
[tasks.lint-kms]
description = "clippy（LinuxKMS 構成。Linux 上でのみ実行可能）"
run = "cargo clippy --locked --no-default-features --features kms --all-targets -- -D warnings"

[tasks.test-kms]
description = "テスト（LinuxKMS 構成。Linux 上でのみ実行可能）"
run = "cargo test --locked --no-default-features --features kms"

# ───────────── ビルド・配布 ─────────────
# リリースビルドは scripts/release-flags.sh を読み込み、バイナリに
# ビルドしたマシンの絶対パス（ユーザー名を含む）が入らないようにする。
# 素の `cargo build --release` ではパスが入るので、配布物は必ずこれらのタスクで作る。

[tasks.release]
description = "リリースビルド（このマシン向け、desktop バックエンド。パスを除去）"
run = """
. scripts/release-flags.sh
cargo build --release --locked
"""

[tasks.build-kms]
description = "Linux 実機向けリリースビルド（LinuxKMS。パスを除去）。Linux 上でのみ実行可能"
run = """
. scripts/release-flags.sh
cargo build --release --locked --no-default-features --features kms
"""

[tasks.check-paths]
description = "リリースバイナリにビルドしたマシンの絶対パスが含まれていないことを確認"
run = """
bin=target/release/home-display
. scripts/release-flags.sh
found=$(strings -a "$bin" | grep -F -e "$HOME/" -e "$cargo_home/" -e "$rustup_home/" -e "$project_root/" || true)
if [ -n "$found" ]; then
  echo "NG: $(printf '%s\n' "$found" | wc -l | tr -d ' ') strings contain build-machine paths:"
  printf '%s\n' "$found" | head -20
  exit 1
fi
echo "OK: no build-machine paths in $bin"
"""

[tasks.deb]
description = "Linux 上で .deb を作成（target/debian/）"
depends = ["build-kms"]
run = """
# cargo-deb is pinned; reinstall when a different version is present.
if [ "$(cargo deb --version 2>/dev/null)" != "cargo-deb 3.8.0" ]; then
  cargo install cargo-deb --locked --version "=3.8.0"
fi
cargo deb --locked --no-build --no-strip
"""
